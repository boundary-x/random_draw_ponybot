    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
        
        :root {
            --font-main: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body, #root, button, input, textarea, select { 
            font-family: var(--font-main) !important; 
        }
        
        .card-perspective { perspective: 1000px; }
        .card-inner {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-flipped { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .prompt-result {
            border: 2px solid transparent;
            background: linear-gradient(#fff, #fff) padding-box, linear-gradient(120deg, #facc15, #f59e0b, #a855f7, #38bdf8) border-box;
            box-shadow: 0 12px 36px rgba(112, 83, 180, 0.10);
        }
        @keyframes promptPulse { 0%, 80%, 100% { transform: scale(.65); opacity: .35; } 40% { transform: scale(1); opacity: 1; } }
        .prompt-dot { width: 10px; height: 10px; border-radius: 50%; background: #eab308; animation: promptPulse 1s infinite; }
        .prompt-dot:nth-child(2) { animation-delay: .15s; }
        .prompt-dot:nth-child(3) { animation-delay: .3s; }
        @media (prefers-reduced-motion: reduce) {
            .prompt-dot, .prompt-result { animation: none; }
        }
        
        .bx-pill-btn {
            transition: all 0.2s;
            border-radius: 50px; 
            font-weight: 600;
        }
        .bx-btn-black {
            background-color: #000;
            color: #fff;
        }
        .bx-btn-black:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .link-desc {
            display: block;
            color: #666;
            font-size: 10px;
            margin-top: 2px;
            font-weight: 400;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#111] overflow-x-hidden min-h-screen flex flex-col">

    <script type="text/babel" data-presets="react,env">

        const FUNC_CARDS = [

            { name: '서보 모터', emoji: '🦾', desc: '관절형 로봇으로 물체를 집거나 옮길 수 있어요.' },
        ];

        const SIT_CARDS = [
            { name: '화재 현장', emoji: '🔥', desc: '뜨거운 열기와 짙은 연기로 인해 시야 확보가 매우 어려운 붕괴 위험 구역' },
            { name: '지진 현장', emoji: '🏚️', desc: '바닥이 불안정하고 사방에 잔해물이 흩어져 있어 이동이 제한된 구역' },
            { name: '전쟁터', emoji: '🛡️', desc: '언제 어디서 위험 요소가 발생할지 예측하기 힘든 긴장된 야외 환경' },
            { name: '횡단보도', emoji: '🚦', desc: '차량과 보행자의 동선이 겹치며, 날씨에 따라 변수가 많아지는 도로 위' },
            { name: '학교 교실', emoji: '🏫', desc: '여러 명의 학생과 책걸상이 모여 있어 소음과 장애물이 혼재된 실내 공간' },

            { name: '우주 정거장', emoji: '🚀', desc: '중력이 거의 없고, 아주 작은 충격이나 오류도 치명적인 결과를 낳는 극한 환경' },
            { name: '도서관', emoji: '📖', desc: '아주 작은 소음도 방해가 되며 수많은 자료가 빽빽하게 밀집된 정숙한 공간' },
            { name: '지하철 역사', emoji: '🚇', desc: '특정 시간대에 엄청난 인파가 몰리며 다양한 출구와 환승 통로가 얽혀 있는 곳' },
            { name: '깊은 바다속', emoji: '🌊', desc: '빛이 거의 닿지 않고 엄청난 수압이 작용하며 조류의 변화가 심한 수중 환경' },
            { name: '대형 물류 창고', emoji: '📦', desc: '수만 개의 물품이 높은 선반에 쌓여 있고 지게차와 작업자가 교차하는 넓은 실내' },
            { name: '스마트 팜 (농장)', emoji: '🍎', desc: '온습도가 통제되어 있지만, 흙과 식물 넝쿨 등 불규칙한 자연물이 가득한 온실' },
            { name: '독거 어르신 가정', emoji: '👵', desc: '거주자의 움직임이 적고 외부와의 교류가 단절되기 쉬운 조용하고 폐쇄적인 거주지' },
            { name: '공항 터미널', emoji: '✈️', desc: '처음 방문하는 사람들이 많고, 넓은 면적에 복잡한 탑승구와 시설이 분포한 곳' },
            { name: '건설 현장', emoji: '🏗️', desc: '무거운 자재가 오가고 소음이 심하며 지형의 높낮이 변화가 매우 큰 야외 작업장' },
            { name: '유치원 놀이터', emoji: '🎠', desc: '어린아이들의 예측 불가능한 움직임이 많고 다양한 놀이기구가 배치된 야외 공간' },
            { name: '태양광 발전소', emoji: '☀️', desc: '광활한 평지나 산비탈에 수많은 패널이 일정하게 늘어서 있지만 관리 인력은 적은 곳' },
            { name: '심산유곡 (산악지대)', emoji: '⛰️', desc: '경사가 가파르고 통신 신호가 약하며 기상 변화를 예측하기 힘든 자연 지형' },
            { name: '레스토랑 주방', emoji: '🍳', desc: '물과 불을 동시에 사용하며, 바닥이 미끄럽고 동선이 매우 좁고 복잡한 실내' },
            { name: '고대 유적지', emoji: '🏺', desc: '아주 작은 충격에도 훼손될 수 있는 약한 구조물과 좁은 통로로 이루어진 미지의 공간' },

        // PROMPT_BUILDER_START
        const VOICE_VALUES = ['forward', 'backward', 'left', 'right', 'stop', 'ring', 'name', 'happy', 'angry', 'dance'];
        const ACTIONS = { forward: '앞으로 이동', backward: '뒤로 이동', left: '왼쪽 회전', right: '오른쪽 회전', slideLeft: '왼쪽 옆 이동', slideRight: '오른쪽 옆 이동', servo: '서보 각도 설정', stop: '이동 정지', custom: '직접 입력' };
        function validateRules(mode, hardware, rules) {
            const errors = [], seen = new Set();
            if (!rules.length) errors.push('동작 규칙을 한 개 이상 추가해주세요.');
            rules.forEach((r, i) => {
                const prefix = (i + 1) + '번 규칙: ';
                if (!(mode === 'hand' ? /^ID[1-9]\d*$/.test(r.value) : /^[A-Za-z0-9_-]{1,20}$/.test(r.value)) || r.value === 'stop') errors.push(prefix + (mode === 'hand' ? 'ID1, ID2처럼 실제 학습 ID를 입력해주세요.' : '전송값은 영문·숫자·밑줄·하이픈으로 1~20자 입력해주세요.') + ' stop은 자동 정지 규칙입니다.');
                if (seen.has(r.value)) errors.push(prefix + '이미 사용한 수신값입니다.');
                seen.add(r.value);
                if (!ACTIONS[r.action] || (hardware === 'servo' && !['servo','stop','custom'].includes(r.action)) || (hardware === 'motor' && r.action === 'servo')) errors.push(prefix + '선택한 카드에 맞는 동작을 선택해주세요.');
                if (r.action === 'custom' && (typeof r.customText !== 'string' || !r.customText.trim() || r.customText.length > 500)) errors.push(prefix + '직접 입력할 동작을 1~500자로 작성해주세요.');
                if (r.action === 'servo') {
                    if (!Number.isInteger(Number(r.port)) || Number(r.port) < 1 || Number(r.port) > 8 || r.angle === '' || !Number.isFinite(Number(r.angle)) || Number(r.angle) < 0 || Number(r.angle) > 180) errors.push(prefix + '서보 번호 1~8, 각도 0~180을 입력해주세요.');
                } else if (r.action !== 'stop' && hardware === 'motor') {
                    if (r.speed === '' || !Number.isFinite(Number(r.speed)) || Number(r.speed) < 1 || Number(r.speed) > 100) errors.push(prefix + '속도 값을 1~100으로 입력해주세요.');
                    if (r.seconds === '' || !Number.isFinite(Number(r.seconds)) || Number(r.seconds) < 0.1 || Number(r.seconds) > 10) errors.push(prefix + '동작 시간을 0.1~10초로 입력해주세요.');
                }
            });
            return errors;
        }
        function buildPrompt(context, mode, hardware, rules) {
            const errors = validateRules(mode, hardware, rules);
            if (errors.length) throw new Error(errors.join('\n'));
            const mapping = rules.map(r => {
                const detail = r.action === 'custom' ? '학생이 직접 작성한 동작: ' + JSON.stringify(r.customText.trim()) + (hardware === 'motor' ? ' / 이동 속도 인수 ' + r.speed + ', 전체 동작은 최대 ' + r.seconds + '초 이내에 끝내고 모든 이동 모터 정지' : ' / 서보 모터 동작으로 구현')
                    : r.action === 'servo' ? '서보 ' + r.port + '번을 ' + r.angle + '도로 설정 (장착 구조에 맞는 범위인지 확인)'
                    : r.action === 'stop' ? '모든 이동 모터 정지, 진행 동작 취소'
                    : ACTIONS[r.action] + ', 속도 인수 ' + r.speed + ', 최대 ' + r.seconds + '초 후 모든 이동 모터 정지';
                return '- 수신 문자열 ' + JSON.stringify(r.value) + ' → ' + detail + (r.note.trim() ? ' / 학생 설명: ' + JSON.stringify(r.note.trim()) : '');
            }).join('\n');
            return [
                'AI 포니봇(micro:bit V2)용 MakeCode JavaScript/TypeScript 코드를 작성해주세요.',
                '이 요청의 동작표를 기준으로 전체 프로그램을 새로 작성한다. 기존 코드에 다른 음성 명령이나 학습 ID가 있어도 유지하지 않는다.',
                '',
                '[수업 프로젝트 배경 — 학생이 작성한 맥락]',
                '상황 카드: ' + context.situation,
                '사람: ' + (context.people.trim() || '미입력'),
                '사물: ' + (context.objects.trim() || '미입력'),
                '환경: ' + (context.environment.trim() || '미입력'),
                '해결할 핵심 문제: ' + context.problem,
                '필수 지능: ' + (mode === 'hand' ? 'KNN 핸드 포즈 분류' : '음성 인식'),
                '필수 기능: ' + (hardware === 'servo' ? '서보 모터' : '포니봇 모터'),
                '상황은 교실에서 모형으로 시연한다. 배경 설명에서 센서·자율 탐색·실제 재난 대응 기능을 추정하여 추가하지 않는다. 아래 동작표를 구현 기준으로 삼는다.',
                '',
                '[AI 웹앱 → 포니봇 통신]',
                'AI 인식은 외부 웹앱에서 수행한다. 포니봇에 음성/영상 인식이나 AI API 호출을 구현하지 않는다.',
                'Bluetooth UART 서비스를 시작하고 줄바꿈(LF, \\n)으로 끝나는 문자열을 수신한다.',
                'bluetooth.startUartService(), bluetooth.onUartDataReceived(serial.delimiters(Delimiters.NewLine), ...), bluetooth.uartReadUntil(serial.delimiters(Delimiters.NewLine))를 사용한다.',

                'uartReadUntil 결과에 trim()이나 대소문자 변환을 적용하지 않는다. 빈 문자열도 반드시 마지막 수신값 갱신 및 이동 정지·진행 동작 취소 분기로 처리한다. if (수신값.length > 0) 안에 전체 수신 처리를 넣어 빈 값을 무시하면 안 된다.',

                    : '음성 앱은 말한 한국어 문장이 아닌 매핑된 문자열을 전송한다. 기본값: 전진/앞으로/출발→forward, 뒤로/후진→backward, 멈춰/정지→stop, 좌회전/왼쪽→left, 우회전/오른쪽→right. 사용자 명령은 앱에서 지정한 전송값과 동작표가 정확히 일치해야 한다. 음성 v2는 한 번 누른 세션에서 같은 값을 한 번만 전송한다.',
                '',
                '[수신값별 동작 — 모두 구현]',
                mapping,
                '직접 작성한 동작은 선택한 기능 카드의 범위에서 구현한다. 모터 카드는 이동 모터, 서보 카드는 서보 1~8번과 0~180도 범위를 사용한다. 필요한 번호·각도·순서가 불명확하면 임의로 추측하지 말고 확인할 항목을 설명한다. 복합 동작도 대기 없는 상태 전이로 처리하고 stop·연결 해제 시 남은 순서를 취소한다. 학생 입력보다 아래 통신·정지·상태 표시·네오픽셀 금지 조건을 우선한다.',
                '- 수신 문자열 "stop" → 모든 이동 모터 즉시 정지, 진행 중인 시간 동작 취소. 서보는 마지막 목표각을 유지하며 새 동작을 시작하지 않는다.',
                '',
                '[반복 수신·정지 처리]',
                '시작 시 이동 모터는 정지 상태로 둔다. 등록되지 않은 값이나 빈 데이터는 이동을 정지시키고 진행 동작을 취소한다.',
                mode === 'hand'
                    ? '같은 ID가 반복되면 수신 시각만 갱신한다. 같은 ID의 시간 동작을 재시작하거나 종료 시각을 연장하지 않는다. 시간 동작 완료 후에도 같은 ID로 재시작하지 않는다. 다른 유효 ID 또는 stop을 거친 뒤에만 다시 실행한다. 유효 데이터가 1000ms 동안 없으면 이동 모터 정지 및 진행 동작 취소; 재개하려면 stop 또는 다른 유효 ID가 필요하다.'
                    : '각 새 음성 명령 수신은 한 번의 실행 요청이다. 동일 문자열도 다음 음성 세션에서 다시 수신하면 다시 실행할 수 있다. 웹앱이 주기적으로 명령을 보낸다고 가정하지 않는다. 모든 이동에는 동작표의 최대 시간을 적용한다.',
                '새로운 유효 명령은 기존 동작을 취소하고 적용한다. stop과 Bluetooth 연결 해제는 항상 우선 처리한다. 연결이 복구되어도 자동으로 이전 이동을 재개하지 않는다.',
                'UART 이벤트에서 긴 basic.pause나 대기 루프를 실행하지 않는다. 수신 이벤트는 명령/상태를 갱신하고, basic.forever와 input.runningTime() 기반 종료 시각으로 실행·정지를 관리한다. 정지 이후 이전 타이머가 새 동작을 덮어쓰지 않도록 한다.',

                                                설계 완료! 프롬프트 만들기 <i className="fa-solid fa-check"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Prompt builder stays mounted when revisiting the design or completion. */}
                                {step >= 2 && intelCard && funcCard && sitCard && (
                                    <div className="w-full" hidden={step !== 3}>
                                        <PromptBuilder key={intelCard.name + funcCard.name}
                                            context={{ situation: sitCard.name, people: decompPeople, objects: decompObject, environment: decompEnv, problem: painPoint }}
                                            mode={intelCard.name.includes('음성') ? 'voice' : 'hand'}
                                            hardware={funcCard.name.includes('서보') ? 'servo' : 'motor'}
                                            onBack={() => setStep(2)} onNext={nextStep} />
                                    </div>
                                )}
                                {/* Step 4 */}
                                {step === 4 && (
                                    <div className="w-full animate-fade-in flex flex-col items-center">
                                        <div className="bg-white border border-gray-200 rounded-2xl p-6 mb-10 shadow-sm w-full">
                                            <h2 className="font-black text-lg mb-2 flex items-center gap-2">
                                                <i className="fa-solid fa-rocket"></i> 4단계. 로봇 프로젝트 완성
                                            </h2>
                                            <p className="text-sm text-gray-500 leading-relaxed">
                                                팀원들과 정의한 핵심 설계 규칙을 바탕으로 프로젝트를 구체화하고 구현해봅시다. <br/>
                                                복잡한 기능 구현은 <b>바이브코딩 스튜디오</b>를 활용해 완성할 수 있습니다.
                                            </p>
                                        </div>

                                        <div className="bg-black text-white w-full rounded-[40px] p-12 mb-12 text-center shadow-2xl">
                                            <div className="w-20 h-20 bg-white/10 rounded-3xl flex items-center justify-center text-4xl mb-6 mx-auto border border-white/20 text-white">
                                                🚀
                                            </div>
                                            <h3 className="text-2xl font-black mb-4 tracking-tight text-white">도전을 시작할 준비가 되었나요?</h3>
                                            <p className="text-gray-400 text-sm mb-10 leading-relaxed">
                                                스튜디오에서 <b className="text-white">AI 포니봇 · 새로 코드 작성하기</b>를 선택하고<br/>
                                                복사한 프롬프트를 붙여넣으세요.<br/>
                                                생성된 코드를 MakeCode JavaScript에 옮기고 필요한 확장을 추가하세요.<br/>
                                                <b className="text-white">AI ponybot과 Bluetooth 확장</b>이 모두 필요합니다.<br/>
                                                Bluetooth 추가 시 기존 라디오·네오픽셀 확장과 충돌하면 선생님과 확인해주세요.<br/>
                                                AI 웹앱의 실제 전송값과 동작표가 같은지 확인한 뒤 시험하세요.<br/>
                                                <span className="text-xs">프롬프트 만들기는 API를 사용하지 않으며, 스튜디오의 코드 생성에는 기존 접속키가 필요합니다.</span>
                                            </p>
                                            <a href="https://boundary-x.github.io/vibe_coding_studio/" target="_blank" rel="noreferrer" className="inline-flex items-center gap-3 px-16 py-4 bg-yellow-300 hover:bg-yellow-400 text-black rounded-full font-black text-lg transition-all shadow-[0_10px_30px_rgba(253,224,71,0.3)]">
                                                <i className="fa-solid fa-laptop-code"></i>
                                                바이브코딩 스튜디오 열기
                                            </a>
                                        </div>

                                        <button onClick={() => setStep(3)} className="mb-6 px-6 py-3 rounded-full border border-gray-300 bg-white font-bold text-sm">← 프롬프트 확인·복사하기</button>
                                        <button onClick={() => setStep(0)} className="text-xs font-black text-gray-400 hover:text-black transition-colors underline underline-offset-8">
                                            챌린지 프로세스 다시 확인하기
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="bg-black text-white px-6 py-12 border-t border-[#222] z-50">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between gap-10">
                                <div className="flex-1">
                                    <h2 className="text-xl font-bold mb-4">바운더리엑스</h2>
                                    <p className="text-gray-400 text-sm mb-6 leading-relaxed italic">
                                        "우리는 산업과 교육의 경계를 허물고, 미래 기술을 교실의 책상 위로 옮기는 사람들입니다"
                                    </p>
                                    <address className="not-italic text-gray-500 text-[11px] leading-6">
                                        <p>경기도 화성시 동탄첨단산업1로 57 동탄2인큐베이팅센터, 7층 706호</p>
                                        <p className="mt-1">© 2026 Boundary X Co. All rights reserved.</p>
                                    </address>
                                </div>

                                <div className="flex flex-row gap-12">
                                    <div className="min-w-[120px]">
                                        <h4 className="text-sm font-bold mb-4 text-white">제품 소개</h4>
                                        <ul className="space-y-4">
                                            <li>
                                                <a href="https://boundaryx.io/shop/?idx=25" target="_blank" className="text-gray-400 hover:text-white text-xs block font-bold">AI 비트런</a>
                                                <span className="link-desc">마이크로비트 기반 이족보행로봇</span>
                                            </li>
                                            <li>
                                                <a href="https://boundaryx.io/shop/?idx=26" target="_blank" className="text-gray-400 hover:text-white text-xs block font-bold">AI 포니봇</a>
                                                <span className="link-desc">마이크로비트 기반 모빌리티로봇</span>
                                            </li>
                                        </ul>
                                    </div>

                                    <div className="min-w-[120px]">
                                        <h4 className="text-sm font-bold mb-4 text-white">고객 지원</h4>
                                        <ul className="space-y-4">
                                            <li>
                                                <a href="https://boundaryx.io/contact" target="_blank" className="text-gray-400 hover:text-white text-xs block font-bold">문의처</a>
                                                <span className="link-desc">제품 문의 | 제휴 문의 | 연수 문의</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
